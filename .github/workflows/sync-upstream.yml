name: Sync upstream repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync from American-Indian-Law-Alliance/aila.ngo
    runs-on: ubuntu-latest
    if: github.repository != 'American-Indian-Law-Alliance/aila.ngo'

    env:
      UPSTREAM_REPOSITORY: American-Indian-Law-Alliance/aila.ngo
      UPSTREAM_BRANCH: main
      TARGET_BRANCH: main

    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream repository
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream changes
        run: |
          git merge --no-edit --allow-unrelated-histories "upstream/${UPSTREAM_BRANCH}"

      - name: Push synced branch
        run: |
          if git diff --quiet "origin/${TARGET_BRANCH}..HEAD"; then
            echo "Already up to date."
            exit 0
          fi

          git push origin "HEAD:${TARGET_BRANCH}"
