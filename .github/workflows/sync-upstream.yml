name: Sync upstream repository

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync from American-Indian-Law-Alliance/aila.ngo
    runs-on: ubuntu-latest
    if: github.repository != 'American-Indian-Law-Alliance/aila.ngo'

    env:
      UPSTREAM_REPOSITORY: American-Indian-Law-Alliance/aila.ngo
      UPSTREAM_BRANCH: main
      TARGET_BRANCH: main

    steps:
      - name: Check out target repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream repository
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          fi
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream changes
        run: |
          set +e
          git merge --no-edit --allow-unrelated-histories "upstream/${UPSTREAM_BRANCH}"
          merge_status=$?
          set -e

          if [ "${merge_status}" -eq 0 ]; then
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -z "${conflicts}" ]; then
            echo "Merge failed without unresolved file conflicts."
            git status --short
            exit "${merge_status}"
          fi

          unexpected_conflicts=""
          while IFS= read -r file; do
            case "${file}" in
              package.json|package-lock.json)
                ;;
              *)
                unexpected_conflicts="${unexpected_conflicts}${file}"$'\n'
                ;;
            esac
          done <<< "${conflicts}"

          if [ -n "${unexpected_conflicts}" ]; then
            echo "Manual sync required. Unexpected conflicts:"
            printf '%s' "${unexpected_conflicts}"
            git status --short
            exit 1
          fi

          echo "Resolving package metadata conflicts by keeping target branch versions."
          for file in package.json package-lock.json; do
            if git diff --name-only --diff-filter=U -- "${file}" | grep -qx "${file}"; then
              git checkout --ours -- "${file}"
              git add "${file}"
            fi
          done

          git commit --no-edit

      - name: Push synced branch
        run: |
          if git diff --quiet "origin/${TARGET_BRANCH}..HEAD"; then
            echo "Already up to date."
            exit 0
          fi

          git push origin "HEAD:${TARGET_BRANCH}"
