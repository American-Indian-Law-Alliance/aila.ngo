404 = "404.html"

[[headers]]
name = "cache-control"
value = "public, max-age=86400"
on = "^/assets/"

[[headers]]
name = "cache-control"
value = "public, max-age=31536000, immutable"
on = "^/pagefind/"

[[redirects]]
from = "^/category/news-events/festival/?$"
to = "/category/festival/"
permanent = true

[[redirects]]
from = "^/wp-content/uploads/2010/09/DOD5\\.pdf$"
to = "/assets/documents/Doctrine-of-Discovery-Booklet-rev3.1.pdf"
permanent = true
